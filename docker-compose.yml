services:
  employee-tracker:
    build: .
    container_name: employee-tracker
    ports:
      - "8000:8000"
    environment:
      VIDEO_SOURCE: "0"
      FRAME_WIDTH: "640"
      FRAME_HEIGHT: "480"
      LINE_POSITION: "310"
      INSIDE_DIRECTION: "right"
      EDGE_MARGIN: "60"
      DETECTION_CONFIDENCE: "0.45"
      IOU_THRESHOLD: "0.50"
      DB_PATH: "/app/data/tracker.db"
      MODEL_PATH: "/app/models/yolov8n.pt"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
